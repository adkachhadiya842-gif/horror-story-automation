
name: Horror Video Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-horror-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f -v

      - name: Verify FFmpeg and Hindi font support
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking FFmpeg..."
          ffmpeg -version

          echo "Checking subtitles filter..."
          ffmpeg -hide_banner -filters | grep subtitles

          echo "Checking drawtext filter..."
          ffmpeg -hide_banner -filters | grep drawtext

          echo "Checking drawtext text shaping support..."
          ffmpeg -hide_banner -h filter=drawtext 2>&1 | grep text_shaping

          echo "Checking Hindi font files..."
          test -f /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf

          fc-match "Noto Sans Devanagari"

          echo "FFmpeg and Hindi font checks passed."

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output folders
        run: |
          mkdir -p output/images
          mkdir -p output/audio
          mkdir -p output/subtitles
          mkdir -p output/thumbnail
          mkdir -p output/assets

      - name: Run horror production pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m scripts.pipeline

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-video-production
          path: output/
          if-no-files-found: warn
          retention-days: 7
