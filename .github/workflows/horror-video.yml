
      - name: Install FFmpeg and Hindi subtitle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-extra \
            libass9 \
            libharfbuzz0b \
            libfribidi0

          sudo fc-cache -f -v

      - name: Verify Hindi subtitle rendering support
        shell: bash
        run: |
          set -euo pipefail

          echo "========== FFMPEG =========="
          ffmpeg -version

          echo "========== SUBTITLES FILTER =========="
          ffmpeg -hide_banner -filters | grep subtitles
          ffmpeg -hide_banner -h filter=subtitles

          echo "========== HINDI FONT =========="
          fc-match "Noto Sans Devanagari"
          fc-match -f "%{file}\n" "Noto Sans Devanagari"

          echo "========== FONT FILES =========="
          find /usr/share/fonts -iname "*Devanagari*"

          echo "========== LINKED LIBRARIES =========="
          ldd "$(command -v ffmpeg)" | grep -Ei "ass|harfbuzz|fribidi" || true

          echo "========== FONT DIRECTORY =========="
          test -d /usr/share/fonts/truetype/noto
          test -f /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf

          echo "Hindi subtitle dependency checks completed."
